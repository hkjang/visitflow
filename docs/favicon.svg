<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="seaton-edge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="edge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent Background, Sharp Edge Monogram S + Office Seat Grid -->
  <g filter="url(#edge-glow)">
    <!-- Main Neon S Monogram Curve -->
    <path d="M 88 34 C 88 22, 32 22, 32 46 C 32 70, 88 70, 88 94 C 88 118, 32 118, 32 106" 
          fill="none" 
          stroke="url(#seaton-edge-grad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Seat Grid Node Markers -->
    <rect x="32" y="24" width="10" height="10" rx="3" fill="#10b981" />
    <rect x="78" y="46" width="10" height="10" rx="3" fill="#06b6d4" />
    <rect x="32" y="84" width="10" height="10" rx="3" fill="#6366f1" />
  </g>
</svg>
