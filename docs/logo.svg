<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="visitflow-edge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="edge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent Background, Sharp Edge Monogram V + Access Pass Checkin Wave -->
  <g filter="url(#edge-glow)">
    <!-- Main Neon V Monogram Path -->
    <path d="M 24 24 L 60 96 L 96 24" 
          fill="none" 
          stroke="url(#visitflow-edge-grad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- QR Pass Node Dots -->
    <circle cx="24" cy="24" r="6" fill="#8b5cf6" />
    <circle cx="60" cy="96" r="7" fill="#ec4899" />
    <circle cx="96" cy="24" r="6" fill="#06b6d4" />
    
    <!-- Center Pass Pulse Line -->
    <path d="M 44 48 L 76 48" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
