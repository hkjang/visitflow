name: Release offline Docker image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build offline image
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          version="${VERSION#v}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker buildx build --load --platform linux/amd64 \
            --build-arg "VERSION=${version}" \
            --build-arg "COMMIT=${COMMIT}" \
            --build-arg "BUILT_AT=${built_at}" \
            -t "seaton:${version}" .
          docker save "seaton:${version}" | gzip -9 > "SeatOn-${VERSION}-linux-amd64-image.tar.gz"
      - name: Verify image archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          test -s "SeatOn-${VERSION}-linux-amd64-image.tar.gz"
          gzip -t "SeatOn-${VERSION}-linux-amd64-image.tar.gz"
      - name: Create GitHub release with image only
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            "SeatOn-${VERSION}-linux-amd64-image.tar.gz" \
            --verify-tag \
            --generate-notes \
            --title "SeatOn ${VERSION}"
